[project]
name = "fsai-parser"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.9",
]

[project.scripts]
fsai-parser = "fsai_parser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsai_parser"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
